<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Tour - Receptours cartagena</title>
    <link rel="icon" type="image/png" href="img/rt.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tours.css">

</head>
<body>

  <section class="tour-hero" id="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1 id="title">Bora Bora</h1>
      <p id="price">Disfruta de un día inolvidable en aguas cristalinas</p>
    </div>
  </section>

  <main class="content-wrapper">
    <section class="tour-section">
      <h2>Detalles del viaje</h2>
      <p id="description"></p>
    </section>

    <section class="tour-section">
      <h2>Itinerario</h2>
      <ul id="itinerary"></ul>
    </section>

    <section class="tour-section">
      <h2>Incluye</h2>
      <ul id="includes"></ul>
    </section>

    <section class="tour-section">
      <h2>Ubicación</h2>
      <iframe id="map" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </section>

    <div class="reserve-box">
      <button id="reserveBtn">¡Reserva Ahora!</button>
    </div>
  </main>

    <script src="script.js"></script>
  <script src="tour-detail.js"></script>
  


</body>
</html>
