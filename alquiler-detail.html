<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Alquiler - Receptours cartagena</title>
    <link rel="icon" type="image/png" href="img/rt.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tours.css">
</head>
<body>

  <section class="tour-hero" id="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1 id="title"></h1>
      <p id="price"></p>
    </div>
  </section>

  <main class="content-wrapper">

    <section class="tour-section">
      <h2>Descripción</h2>
      <p id="description"></p>
    </section>

    <section class="tour-section">
      <h2>Detalles</h2>
      <ul>
        <li><strong>Capacidad:</strong> <span id="capacidad"></span></li>
        <li><strong>Duración:</strong> <span id="duracion"></span></li>
      </ul>
    </section>

    <section class="tour-section">
      <h2>Incluye</h2>
      <ul id="includes"></ul>
    </section>

    <div class="reserve-box">
      <button id="reserveBtn">¡Reserva Ahora!</button>
    </div>

  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Clave única: nombre — consistente con openAlquiler() en script.js
      const nombre = localStorage.getItem("alquilerSeleccionado");
      const item   = nombre ? alquiler.find(a => a.nombre === nombre) : null;

      if (!item) {
        document.getElementById("title").textContent       = "Servicio no encontrado";
        document.getElementById("description").textContent = "Vuelve al catálogo e intenta de nuevo.";
        return;
      }

      document.title = `${item.nombre} — Cartagena Trips`;
      document.getElementById("hero").style.backgroundImage = `url('${item.img}')`;
      document.getElementById("title").textContent       = item.nombre;
      document.getElementById("description").textContent = item.descripcion;

      // Estos campos son opcionales en el catálogo actual
      const capEl = document.getElementById("capacidad");
      const durEl = document.getElementById("duracion");
      if (capEl) capEl.textContent = item.capacidad || "Consultar";
      if (durEl) durEl.textContent = item.duracion  || "Consultar";

      const includesEl = document.getElementById("includes");
      if (includesEl) {
        includesEl.innerHTML = Array.isArray(item.incluye)
          ? item.incluye.map(i => `<li>${i}</li>`).join("")
          : "<li>Consultar detalles por WhatsApp</li>";
      }

      document.getElementById("reserveBtn").onclick = () => {
        const msg = encodeURIComponent(`Hola, quiero reservar: ${item.nombre}`);
        window.open(`https://wa.me/+573002459650?text=${msg}`, "_blank");
      };
    });
  </script>

</body>
</html>
